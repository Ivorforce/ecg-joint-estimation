[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecgfit"
version = "1.0.0"
description = "Joint beat-morphology and baseline estimation for the 12-lead ECG"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lukas Tenbrink" }]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "PyWavelets",
    "tensorflow>=2.16",
    "keras>=3",
]

[project.optional-dependencies]
# The experiment scripts in scripts/.
experiments = ["wfdb", "matplotlib"]
